[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "euromail"
version = "0.5.0"
description = "Official Python SDK for the EuroMail transactional email service"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["euromail", "email", "transactional", "smtp"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "respx>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/euromail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
